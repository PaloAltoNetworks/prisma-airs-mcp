name: Build and Deploy Documentation

on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - ".github/workflows/docs.yml"
    pull_request:
        branches:
            - main
        paths:
            - "docs/**"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write
    pull-requests: write # Allow commenting on PRs

# Allow only one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Build job
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Setup Ruby
              uses: ruby/setup-ruby@e69dcf3ded5967f30d7ef595704928d91cdae930 # v1
              with:
                  ruby-version: "3.2"
                  bundler: "latest"
                  bundler-cache: true
                  working-directory: ./docs

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

            - name: Build with Jekyll
              run: |
                  cd docs
                  bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
              env:
                  JEKYLL_ENV: production

            - name: HTML Proofer
              run: |
                  cd docs
                  gem install html-proofer
                  htmlproofer ./_site --disable-external --allow-hash-href --ignore-urls "/^#/"
              continue-on-error: true

            - name: Upload artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: ./docs/_site

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

    # Test job for PRs
    test:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Setup Ruby
              uses: ruby/setup-ruby@e69dcf3ded5967f30d7ef595704928d91cdae930 # v1
              with:
                  ruby-version: "3.2"
                  bundler: "latest"
                  bundler-cache: true
                  working-directory: ./docs

            - name: Build Jekyll site
              run: |
                  cd docs
                  bundle exec jekyll build

            - name: Validate HTML
              run: |
                  cd docs
                  gem install html-proofer
                  htmlproofer ./_site --disable-external --allow-hash-href --ignore-urls "/^#/"
              continue-on-error: true

            - name: Check for broken links
              run: |
                  cd docs/_site
                  npx linkinator . --recurse --skip "^(?!http://localhost)"
              continue-on-error: true

            - name: Comment PR
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
              if: always()
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: '✅ Documentation build completed successfully! Preview will be available after merge.'
                      })
